server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name sociolab.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/workbench-acme;
        default_type text/plain;
    }
    location / { return 301 https://sociolab.cn$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name sociolab.cn;
    ssl_certificate /etc/letsencrypt/live/sociolab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sociolab.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != sociolab.cn) { return 444; }
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host sociolab.cn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
