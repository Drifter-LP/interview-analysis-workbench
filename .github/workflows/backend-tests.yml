name: Backend regression tests
on:
  push:
  pull_request:
jobs:
  isolated-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-cloud.txt
      - run: python -m unittest discover -s tests -p 'test_*audit.py' -v
      - run: python tests/check_demo_sample.py
